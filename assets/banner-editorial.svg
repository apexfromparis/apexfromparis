<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Dark matte background -->
    <linearGradient id="bgMatte" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>

    <!-- Subtle technical grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.02" />
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: "JetBrains Mono", "SF Mono", "Roboto Mono", Consolas, monospace;
      }
      .title-name {
        font-weight: 700;
        letter-spacing: 0.12em;
        fill: #FFFFFF;
        font-size: 32px;
      }
      .subtitle-role {
        font-weight: 400;
        letter-spacing: 0.05em;
        fill: #8B949E;
        font-size: 15px;
      }
      .focus-label {
        font-weight: 400;
        fill: #6E7681;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      .focus-target {
        font-weight: 600;
        fill: #C9D1D9;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bgMatte)" />
  <rect width="1200" height="320" fill="url(#gridPattern)" />

  <!-- Layout Container -->
  <g transform="translate(100, 0)">
    
    <!-- Top Monospace Index Tag -->
    <text x="0" y="85" class="font-mono" font-size="11" fill="#3B82F6" letter-spacing="0.15em">// SOFTWARE ENGINEER</text>

    <!-- Name -->
    <text x="0" y="132" class="font-sans title-name">NOHAM OUAZINE</text>

    <!-- Subtle Horizontal Blue Accent Line -->
    <rect x="0" y="152" width="64" height="2" fill="#3B82F6" rx="1" />
    <rect x="68" y="152" width="220" height="1" fill="#21262D" />

    <!-- Role -->
    <text x="0" y="184" class="font-sans subtitle-role">Aspiring Software Engineer</text>

    <!-- Project Info -->
    <g transform="translate(0, 218)">
      <text x="0" y="0" class="font-mono focus-label">
        ↳ Building <tspan class="focus-target">OpenReverse</tspan>
      </text>
    </g>

  </g>

  <!-- Clean Subtle Right Corner Minimal Mark -->
  <g transform="translate(1100, 160)" opacity="0.3">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#30363D" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="3" fill="#3B82F6" />
  </g>

</svg>
