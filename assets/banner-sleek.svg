<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: "JetBrains Mono", "SF Mono", "Roboto Mono", Consolas, monospace;
      }
      .heading-name {
        font-weight: 800;
        letter-spacing: 0.06em;
        fill: #FFFFFF;
        font-size: 38px;
      }
      .subheading-role {
        font-weight: 400;
        letter-spacing: 0.02em;
        fill: #94A3B8;
        font-size: 17px;
      }
      .terminal-prompt {
        font-weight: 500;
        fill: #3B82F6;
      }
      .terminal-txt {
        font-weight: 400;
        fill: #64748B;
      }
      .terminal-highlight {
        font-weight: 600;
        fill: #E2E8F0;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="#0A0D14" />

  <!-- Extremely subtle tech dot grid -->
  <g fill="#FFFFFF" fill-opacity="0.035">
    <circle cx="100" cy="50" r="1"/><circle cx="140" cy="50" r="1"/><circle cx="180" cy="50" r="1"/>
    <circle cx="100" cy="90" r="1"/><circle cx="140" cy="90" r="1"/><circle cx="180" cy="90" r="1"/>
    <circle cx="1000" cy="230" r="1"/><circle cx="1040" cy="230" r="1"/><circle cx="1080" cy="230" r="1"/>
    <circle cx="1000" cy="270" r="1"/><circle cx="1040" cy="270" r="1"/><circle cx="1080" cy="270" r="1"/>
  </g>

  <!-- Clean Top Accent Micro Bar -->
  <rect x="0" y="0" width="1200" height="2" fill="#1E293B" />
  <rect x="120" y="0" width="80" height="2" fill="#3B82F6" />

  <!-- Main Content Block -->
  <g transform="translate(120, 0)">
    
    <!-- Blue Micro Dot + Name -->
    <text x="0" y="128" class="font-sans heading-name">NOHAM OUAZINE</text>

    <!-- Subtitle: Aspiring Software Engineer -->
    <text x="2" y="166" class="font-sans role-text subheading-role">Aspiring Software Engineer</text>

    <!-- Discreet Minimal Status Line -->
    <g transform="translate(2, 212)">
      <text x="0" y="0" class="font-mono" font-size="13">
        <tspan class="terminal-prompt">&gt; </tspan>
        <tspan class="terminal-txt">Building </tspan>
        <tspan class="terminal-highlight">OpenReverse</tspan>
      </text>
    </g>

  </g>

  <!-- Discreet Corner Technical Code -->
  <text x="1100" y="270" text-anchor="end" class="font-mono" font-size="10" fill="#243044" letter-spacing="0.12em">GITHUB // NOHAM-OUAZINE</text>

</svg>
