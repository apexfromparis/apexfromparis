<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0D12"/>
      <stop offset="1" stop-color="#080A0E"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <radialGradient id="glow" cx="30%" cy="50%" r="55%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .mono {
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <line x1="72" y1="48" x2="1128" y2="48" stroke="#18202C"/>
  <line x1="72" y1="272" x2="1128" y2="272" stroke="#18202C"/>

  <rect x="91" y="102" width="3" height="116" rx="1.5" fill="url(#line)"/>

  <g transform="translate(120 0)">
    <text
      x="0"
      y="137"
      class="sans"
      font-size="42"
      font-weight="700"
      letter-spacing="3.5"
      fill="#F8FAFC"
    >
      NOHAM OUAZINE
    </text>

    <text
      x="1"
      y="174"
      class="sans"
      font-size="17"
      font-weight="400"
      fill="#94A3B8"
    >
      Aspiring Software Engineer
    </text>

    <text
      x="2"
      y="211"
      class="mono"
      font-size="11"
      letter-spacing="1.1"
      fill="#64748B"
    >
      SYSTEMS  ·  SOFTWARE  ·  BACKEND  ·  AI
    </text>
  </g>

  <circle cx="1127" cy="48" r="2.5" fill="#3B82F6"/>

  <text
    x="1128"
    y="259"
    text-anchor="end"
    class="mono"
    font-size="9"
    letter-spacing="1.5"
    fill="#334155"
  >
    BUILDING THINGS THAT MATTER
  </text>
</svg>