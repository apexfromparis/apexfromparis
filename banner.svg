<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Dark matte background gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#080B11" />
    </linearGradient>

    <!-- Subtle blue accent line gradient -->
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Dot matrix pattern for subtle technical background -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: "JetBrains Mono", "SF Mono", "Roboto Mono", Consolas, "Fira Code", monospace;
      }
      .name-text {
        font-weight: 700;
        letter-spacing: 0.08em;
        fill: #F8FAFC;
        font-size: 34px;
      }
      .role-text {
        font-weight: 400;
        letter-spacing: 0.02em;
        fill: #94A3B8;
        font-size: 16px;
      }
      .focus-text {
        font-weight: 500;
        letter-spacing: 0.03em;
        fill: #64748B;
        font-size: 13px;
      }
      .focus-val {
        font-weight: 600;
        fill: #CBD5E1;
      }
      .badge-bg {
        fill: #111827;
        stroke: #1E293B;
        stroke-width: 1;
      }
      .tech-marker {
        fill: #1E293B;
        stroke: #334155;
        stroke-width: 1;
      }
      .tech-line {
        stroke: #1E293B;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bgGrad1)" />

  <!-- Subtle Minimal Dot Matrix Grid -->
  <rect width="1200" height="320" fill="url(#dotGrid)" />

  <!-- Architectural Framing / Minimal Guides -->
  <line x1="60" y1="40" x2="60" y2="280" class="tech-line" stroke-dasharray="2 6" opacity="0.4" />
  <line x1="60" y1="40" x2="1140" y2="40" class="tech-line" opacity="0.25" />
  <line x1="60" y1="280" x2="1140" y2="280" class="tech-line" opacity="0.25" />
  
  <!-- Subtle Crosshairs / Corner Marks -->
  <path d="M 55 40 L 65 40 M 60 35 L 60 45" class="tech-marker" opacity="0.5" />
  <path d="M 1135 40 L 1145 40 M 1140 35 L 1140 45" class="tech-marker" opacity="0.5" />
  <path d="M 55 280 L 65 280 M 60 275 L 60 285" class="tech-marker" opacity="0.5" />
  <path d="M 1135 280 L 1145 280 M 1140 275 L 1140 285" class="tech-marker" opacity="0.5" />

  <!-- Subtle System ID on top right (Understated) -->
  <text x="1130" y="65" text-anchor="end" class="font-mono" font-size="11" fill="#334155" letter-spacing="0.1em">DEV // 2026</text>

  <!-- Left Blue Precision Accent Bar -->
  <rect x="90" y="98" width="3.5" height="120" rx="1.75" fill="url(#blueAccent)" />

  <!-- Content Block (Slight Left-Aligned with generous whitespace) -->
  <g transform="translate(112, 0)">
    
    <!-- Primary Name -->
    <text x="0" y="136" class="font-sans name-text">NOHAM OUAZINE</text>

    <!-- Subtitle: Role -->
    <text x="1" y="170" class="font-sans role-text">Aspiring Software Engineer</text>

    <!-- Discreet Project Badge / Tag -->
    <g transform="translate(1, 196)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="206" height="26" rx="13" class="badge-bg" />
      
      <!-- Subtle Active Status Dot -->
      <circle cx="14" cy="13" r="3.5" fill="#3B82F6" />
      
      <!-- Text: Building OpenReverse -->
      <text x="26" y="17" class="font-mono focus-text">
        Building <tspan class="focus-val">OpenReverse</tspan>
      </text>
    </g>

  </g>

  <!-- Subtle Bottom Right Details (Minimal) -->
  <text x="1130" y="265" text-anchor="end" class="font-mono" font-size="11" fill="#1E293B" letter-spacing="0.08em">OPENREVERSE</text>

</svg>
